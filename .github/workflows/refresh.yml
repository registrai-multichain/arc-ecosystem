name: Daily data refresh
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node --test scripts/*.test.mjs
      - run: node scripts/refresh.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- data README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data README.md
            git commit -m "data: $(date -u +%F) UTC refresh"
            git pull --rebase
            git push
          else
            echo "no changes"
          fi
      # copy to the Hugging Face dataset once the owner adds the HF_TOKEN secret (write token); repo id from the HF_DATASET variable
      - name: Copy to Hugging Face
        if: env.HAS_HF_TOKEN == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET || 'registrai/arc-ecosystem' }}
        run: |
          rm -rf hf && mkdir -p hf/data
          cp data/*.json data/*.csv hf/data/ && cp LICENSE hf/
          node scripts/hf-card.mjs > hf/README.md
          pipx run --spec huggingface_hub==2.2.0 hf upload "$HF_DATASET" hf . --repo-type dataset --commit-message "data: $(date -u +%F) UTC copy"
